services:
  - type: web
    name: origins-license-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: origins-license-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false

databases:
  - name: origins-license-db
    region: frankfurt
    plan: free
    databaseName: originslicenses
    user: originslicenses
    ipAllowList: []
